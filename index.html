<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>看剧生词</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: #f3f0e8;
    color: #1f1c16;
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 8px; font-weight: 650; }
  h2 { font-size: 1.15rem; line-height: 1.35; margin: 0 0 6px; font-weight: 650; }
  .lede, .blurb p, .help, .meta, .covered, .tip, .now, .field-label { color: #5e584e; }
  .lede { margin: 0; font-size: 1rem; }
  .shows { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
  button.show {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    background: #fffcf7;
    border: 1px solid #cfc8ba;
    border-radius: 8px;
  }
  button.show.is-on { border-color: #243f33; box-shadow: inset 0 0 0 1px #243f33; }
  .show-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .show-name { font-weight: 650; }
  .diff {
    display: inline-block;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 0.85rem;
    line-height: 1.7;
  }
  .diff-ys { background: #e5efe8; color: #243f33; }
  .diff-det { background: #e4eef2; color: #1d4e63; }
  .diff-ado { background: #f3ead8; color: #8a5a12; }
  .show-meta, .show-reason {
    display: block;
    margin-top: 4px;
    color: #5e584e;
    font-size: 0.92rem;
    font-weight: 400;
  }
  .missing {
    margin-top: 12px;
    padding: 14px;
    background: #fffcf7;
    border: 1px solid #d8d2c6;
    border-radius: 8px;
  }
  .choice { display: grid; gap: 8px; margin-top: 14px; }
  .mods { grid-template-columns: 1fr 1fr; }
  .modes { grid-template-columns: 1fr 1fr 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  button.tap {
    min-height: 48px;
    padding: 10px 8px;
    background: #fffcf7;
    border: 1px solid #cfc8ba;
    border-radius: 6px;
  }
  button.tap.is-on { background: #243f33; color: #fffcf7; border-color: #243f33; }
  button.tap.is-fuzzy { background: #8a5a12; color: #fffcf7; border-color: #8a5a12; }
  button.tap:disabled { opacity: 0.42; }
  button.wide { width: 100%; margin-top: 12px; }
  .field { display: block; margin-top: 12px; }
  .field-label { display: block; font-size: 0.85rem; margin-bottom: 4px; }
  select, input[type="text"] {
    width: 100%;
    min-height: 48px;
    padding: 8px 12px;
    background: #fffcf7;
    border: 1px solid #cfc8ba;
    border-radius: 6px;
  }
  .blurb, .card, .stat, .note, .save-error {
    background: #fffcf7;
    border: 1px solid #d8d2c6;
    border-radius: 8px;
  }
  .blurb { margin-top: 12px; padding: 12px 14px; }
  .blurb p { margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stat { flex: 1 1 7rem; min-width: 0; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .stat span { color: #5e584e; font-size: 0.85rem; }
  .card { margin-top: 12px; padding: 16px; }
  .card-top, .quiz-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: #5e584e;
    font-size: 0.92rem;
  }
  .word {
    font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    font-size: 1.8rem;
    line-height: 1.25;
    margin: 10px 0 0;
    overflow-wrap: anywhere;
  }
  .meta { margin: 6px 0 0; font-size: 0.95rem; }
  .zh { font-size: 1.25rem; font-weight: 650; margin: 12px 0 0; overflow-wrap: anywhere; }
  .covered { margin: 12px 0 0; }
  .example { background: #efeae1; padding: 12px; margin-top: 12px; border-radius: 6px; }
  .example p { margin: 0; overflow-wrap: anywhere; }
  .example .ex-zh { color: #5e584e; margin-top: 6px; }
  .tip { margin: 10px 0 0; font-size: 0.95rem; }
  .status-row, .nav, .quiz-actions { display: grid; gap: 8px; margin-top: 12px; }
  .status-row { grid-template-columns: 1fr 1fr 1fr; }
  .nav, .quiz-actions { grid-template-columns: 1fr 1fr; }
  .now { margin: 8px 0 0; font-size: 0.95rem; }
  .help { margin: 14px 0 0; font-size: 0.95rem; }
  .list-title { font-size: 1.08rem; margin: 22px 0 8px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  button.row {
    width: 100%;
    display: grid;
    grid-template-columns: 4.6rem minmax(0, 1fr);
    gap: 2px 8px;
    text-align: left;
    padding: 10px 12px;
    min-height: 48px;
    background: #fffcf7;
    border: 1px solid #d8d2c6;
    border-radius: 6px;
  }
  button.row.is-current { border-color: #243f33; }
  .time { color: #5e584e; font-variant-numeric: tabular-nums; font-size: 0.85rem; }
  .main { min-width: 0; }
  .wen { font-weight: 650; overflow-wrap: anywhere; }
  .wzh { color: #5e584e; grid-column: 2; overflow-wrap: anywhere; }
  .mark { font-size: 0.85rem; color: #5e584e; white-space: nowrap; }
  button.row.is-on .mark { color: #fffcf7; }
  .note { margin-top: 12px; padding: 14px; }
  .miss { margin: 8px 0 0; overflow-wrap: anywhere; }
  .save-error { margin-top: 12px; padding: 10px 12px; border-color: #8a5a12; }
  .place-options { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  button.place-opt {
    width: 100%;
    text-align: left;
    min-height: 48px;
    padding: 12px 14px;
    background: #fffcf7;
    border: 1px solid #cfc8ba;
    border-radius: 8px;
  }
  .place-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  footer {
    max-width: 42rem;
    margin: 0 auto;
    padding: 8px 16px 32px;
    color: #5e584e;
    font-size: 0.92rem;
  }
  footer p { margin: 8px 0; }
  :focus-visible { outline: 2px solid #243f33; outline-offset: 2px; }
  @media (max-width: 380px) {
    .modes, .status-row { grid-template-columns: 1fr; }
  }
</style>
</head>

<script type="application/json" id="episodes">[{"id":"s01e01","label":"第1集","title":"第一天上高中","blurb":"谢尔顿第一天上高中，从火车旁白、晚饭、教堂、校规，一直到晚上。词按字幕时间排，小学词已经拿掉。","items":[{"id":"career","level":"cet4","scene":"开场旁白","en":"career","pos":"名词","zh":"事业、职业生涯","example":"In fact, if my career","exampleZh":"事实上，如果我的事业","time":"00:00:14","tip":"a career in ... = 在某个领域的事业。"},{"id":"theoretical","level":"cet4","scene":"开场旁白","en":"theoretical","pos":"形容词","zh":"理论的","example":"in theoretical physics hadn't worked out, my backup plan","exampleZh":"要是理论物理这条路没走成，我的备用计划","time":"00:00:16","tip":"theoretical physics = 理论物理。"},{"id":"physics","level":"foundation","scene":"开场旁白","en":"physics","pos":"名词","zh":"物理学","example":"in theoretical physics hadn't worked out, my backup plan","exampleZh":"要是理论物理这条路没走成，我的备用计划","time":"00:00:16"},{"id":"workedout","level":"foundation","scene":"开场旁白","en":"work out","pos":"短语","zh":"成功、行得通","example":"in theoretical physics hadn't worked out, my backup plan","exampleZh":"要是理论物理这条路没走成，我的备用计划","time":"00:00:16","tip":"这里不是锻炼。hadn't worked out = 没有成功。"},{"id":"backup","level":"foundation","scene":"开场旁白","en":"backup plan","pos":"名词","zh":"备用计划","example":"in theoretical physics hadn't worked out, my backup plan","exampleZh":"要是理论物理这条路没走成，我的备用计划","time":"00:00:16"},{"id":"professional","level":"cet4","scene":"开场旁白","en":"professional","pos":"形容词","zh":"职业的","example":"was to become a professional ticket taker.","exampleZh":"就是去当一名职业检票员。","time":"00:00:19"},{"id":"tickettaker","level":"foundation","scene":"开场旁白","en":"ticket taker","pos":"名词","zh":"检票员","example":"was to become a professional ticket taker.","exampleZh":"就是去当一名职业检票员。","time":"00:00:19","tip":"在车上或门口收票、检票的人。"},{"id":"hobo","level":"foundation","scene":"开场旁白","en":"hobo","pos":"名词","zh":"流浪汉","example":"Or hobo.","exampleZh":"或者当流浪汉。","time":"00:00:22","tip":"旧词，指扒火车到处流浪的人。这里是玩笑。"},{"id":"figured","level":"foundation","scene":"开场旁白","en":"figure out","pos":"短语","zh":"弄明白","example":"and when I figured out that trains allowed me","exampleZh":"当我弄明白火车能让我……","time":"00:00:30"},{"id":"prove","level":"foundation","scene":"开场旁白","en":"prove","pos":"动词","zh":"证明","example":"to prove Newton's first law...","exampleZh":"去证明牛顿第一定律……","time":"00:00:33"},{"id":"law","level":"foundation","scene":"开场旁白","en":"law","pos":"名词","zh":"定律","example":"to prove Newton's first law...","exampleZh":"去证明牛顿第一定律……","time":"00:00:33","tip":"科学里的 law 是定律，不是法律。"},{"id":"object","level":"foundation","scene":"开场旁白","en":"object","pos":"名词","zh":"物体","example":"An object in motion stays in motion","exampleZh":"运动中的物体会继续运动。","time":"00:00:35","tip":"这里是物体，不是目标，也不是反对。"},{"id":"motion","level":"foundation","scene":"开场旁白","en":"motion","pos":"名词","zh":"运动","example":"An object in motion stays in motion","exampleZh":"运动中的物体会继续运动。","time":"00:00:35","tip":"in motion = 处于运动中。"},{"id":"unless","level":"foundation","scene":"开场旁白","en":"unless","pos":"连词","zh":"除非","example":"unless acted upon by an unbalanced force...","exampleZh":"除非受到一个不平衡的力……","time":"00:00:40"},{"id":"upon","level":"foundation","scene":"开场旁白","en":"upon","pos":"介词","zh":"在……之上；被……作用","example":"unless acted upon by an unbalanced force...","exampleZh":"除非受到一个不平衡的力……","time":"00:00:40","tip":"upon 在这里等于 on。acted upon by = 受到……的作用。"},{"id":"unbalanced","level":"cet4","scene":"开场旁白","en":"unbalanced","pos":"形容词","zh":"不平衡的","example":"unless acted upon by an unbalanced force...","exampleZh":"除非受到一个不平衡的力……","time":"00:00:40","tip":"un- 表示否定。balanced 是平衡的。"},{"id":"force","level":"foundation","scene":"开场旁白","en":"force","pos":"名词","zh":"力","example":"unless acted upon by an unbalanced force...","exampleZh":"除非受到一个不平衡的力……","time":"00:00:40","tip":"物理里的力。不是强迫，也不是军队。"},{"id":"dimwitted","level":"foundation","scene":"开场旁白","en":"dimwitted","pos":"形容词","zh":"愚钝的","example":"I don't care how dimwitted you are.","exampleZh":"我才不管你有多笨。","time":"00:00:52","tip":"dim 是昏暗。dimwit 就是笨蛋。"},{"id":"principle","level":"cet4","scene":"开场旁白","en":"principle","pos":"名词","zh":"原理","example":"Scientific principles have to make you smile.","exampleZh":"科学原理总得让你笑一笑。","time":"00:00:55","tip":"不要和 principal（校长）搞混，读音接近。"},{"id":"newtonian","level":"cet4","scene":"开场旁白","en":"Newtonian","pos":"形容词","zh":"牛顿的","example":"in 1989 cared about newtonian physics.","exampleZh":"1989 年没人在乎牛顿物理学。","time":"00:01:01"},{"id":"hell","level":"foundation","scene":"晚饭","en":"hell","pos":"感叹","zh":"到底、他妈的","example":"the hell were you doing","exampleZh":"你到底在外面干什么","time":"00:01:21","tip":"这里是骂人，不是宗教里的地狱。整句是 What the hell were you doing。后面还有 The hell with that，意思是去它的。"},{"id":"language","level":"foundation","scene":"晚饭","en":"language","pos":"名词","zh":"注意用词","example":"George, language.","exampleZh":"乔治，注意你的嘴。","time":"00:01:23","tip":"不是在问“什么语言”，是让人别骂脏话。"},{"id":"kinematics","level":"cet4","scene":"晚饭","en":"dimensional kinematics","pos":"名词","zh":"维度运动学","example":"I was exploring dimensional kinematics.","exampleZh":"我在研究维度运动学。","time":"00:01:25","tip":"谢尔顿用来解释自己在车库干什么。听到能认即可。"},{"id":"adopted","level":"cet4","scene":"晚饭","en":"adopted","pos":"形容词","zh":"被领养的","example":"Admit it... he's adopted.","exampleZh":"承认吧……他是领养的。","time":"00:01:28"},{"id":"twin","level":"foundation","scene":"晚饭","en":"twin","pos":"名词","zh":"双胞胎","example":"when I have a twin sister?","exampleZh":"我还有个双胞胎妹妹呢？","time":"00:01:30"},{"id":"arranged","level":"foundation","scene":"晚饭","en":"be arranged","pos":"短语","zh":"可以安排、办得到","example":"That can still be arranged.","exampleZh":"那也不是办不到。","time":"00:01:37","tip":"这里是吓唬：你想被领养，也不是不行。"},{"id":"pray","level":"foundation","scene":"晚饭","en":"pray","pos":"动词","zh":"祷告","example":"Now, let's pray.","exampleZh":"现在我们祷告吧。","time":"00:01:39","tip":"饭前说的。和后面的 say grace、bless 是同一件事。"},{"id":"leavebe","level":"foundation","scene":"晚饭","en":"Leave him be.","pos":"句子","zh":"别逼他。","example":"Leave him be.","exampleZh":"随他去。","time":"00:01:44","tip":"leave someone be = 别去管他、别强迫他。"},{"id":"business","level":"foundation","scene":"晚饭","en":"None of your business.","pos":"句子","zh":"不关你的事。","example":"None of your business.","exampleZh":"不关你的事。","time":"00:01:52","tip":"也可以说 Mind your own business."},{"id":"hence","level":"foundation","scene":"晚饭","en":"Hence the mittens.","pos":"句子","zh":"所以才戴连指手套。","example":"Hence the mittens.","exampleZh":"所以才戴连指手套。","time":"00:01:53","tip":"hence 后面直接接结果：所以才……"},{"id":"mittens","level":"foundation","scene":"晚饭","en":"mittens","pos":"名词","zh":"连指手套","example":"Hence the mittens.","exampleZh":"所以才戴连指手套。","time":"00:01:53","tip":"普通手套是 gloves。mittens 是拇指单独、其余指头在一起。"},{"id":"nourishment","level":"cet4","scene":"晚饭","en":"nourishment","pos":"名词","zh":"营养、滋养","example":"and for the nourishment of our bodies,","exampleZh":"以及滋养我们的身体，","time":"00:01:58"},{"id":"receive","level":"foundation","scene":"晚饭","en":"receive","pos":"动词","zh":"领受","example":"we're about to receive and for the nourishment of our bodies,","exampleZh":"我们即将领受的食物，以及滋养我们的身体，","time":"00:01:58","tip":"祷告里的固定说法。"},{"id":"bless","level":"foundation","scene":"晚饭","en":"bless","pos":"动词","zh":"保佑、祝福","example":"and bless the hands that prepared it.","exampleZh":"并保佑准备这顿饭的手。","time":"00:02:01","tip":"bless the hands = 保佑做饭的人。"},{"id":"howcome","level":"foundation","scene":"晚饭","en":"How come ...?","pos":"句型","zh":"怎么会……？","example":"How come we ain't got no tater tots?","exampleZh":"我们怎么连薯饼都没有？","time":"00:02:06","tip":"how come = why。ain't 是口语里的 isn't / aren't。"},{"id":"taters","level":"foundation","scene":"晚饭","en":"tater tots","pos":"名词","zh":"薯饼","example":"How come we ain't got no tater tots?","exampleZh":"我们怎么连薯饼都没有？","time":"00:02:06","tip":"tater 是 potato 的口语。tots 是一小团，合起来是油炸小薯饼。"},{"id":"potaters","level":"foundation","scene":"晚饭","en":"mashed potaters","pos":"名词","zh":"土豆泥","example":"over mashed potaters any day.","exampleZh":"我哪天都宁可吃薯饼，也不要土豆泥。","time":"00:02:11","tip":"potaters 就是 potatoes，口音把 potato 说成 potater。mashed = 捣成泥的。"},{"id":"atleast1","level":"foundation","scene":"晚饭","en":"at least","pos":"短语","zh":"至少","example":"Can we at least have tater tots tomorrow?","exampleZh":"明天至少给薯饼行不行？","time":"00:02:12"},{"id":"accent","level":"cet4","scene":"晚饭","en":"adopt an accent","pos":"短语","zh":"养成一种口音","example":"that led me to adopt a mid-Atlantic accent.","exampleZh":"正是这种晚饭让我养成了不带家乡味的通用口音。","time":"00:02:17","tip":"这里的 adopt 是“采用”，不是前面的“领养”。"},{"id":"nobel","level":"foundation","scene":"晚饭","en":"Nobel","pos":"名词","zh":"诺贝尔奖","example":"Nobel prize winners...","exampleZh":"诺贝尔奖得主……","time":"00:02:20","tip":"Nobel prize = 诺贝尔奖。"},{"id":"ought","level":"foundation","scene":"晚饭","en":"ought not","pos":"短语","zh":"不该","example":"Ought not be orderin' tater tots.","exampleZh":"不该点薯饼。","time":"00:02:22","tip":"ought to = 应该。ought not = 不该。orderin' = ordering。"},{"id":"bigdeal","level":"foundation","scene":"晚饭","en":"a big deal","pos":"短语","zh":"一件大事","example":"Freshman year, that's a big deal.","exampleZh":"高一这一年，可是件大事。","time":"00:02:30","tip":"freshman year = 高中第一年。"},{"id":"freshman","level":"foundation","scene":"晚饭","en":"freshman","pos":"名词","zh":"高一新生","example":"Freshman year, that's a big deal.","exampleZh":"高一这一年，可是件大事。","time":"00:02:30","tip":"美国高中第一年叫 freshman year。"},{"id":"thrilled","level":"cet4","scene":"晚饭","en":"thrilled","pos":"形容词","zh":"高兴极了","example":"and I'm thrilled.","exampleZh":"我高兴坏了。","time":"00:02:41","tip":"比 happy 强得多。"},{"id":"assaulted","level":"cet4","scene":"晚饭","en":"assaulted","pos":"动词","zh":"遭到攻击","example":"I'm not going to be assaulted.","exampleZh":"我不会被人打的。","time":"00:02:48","tip":"比 hit 正式。谢尔顿用它代替“挨揍”。"},{"id":"haven","level":"cet4","scene":"晚饭","en":"haven","pos":"名词","zh":"安全的地方、净土","example":"High school is a haven for higher learning.","exampleZh":"高中是高等学问的净土。","time":"00:02:49"},{"id":"playbook","level":"foundation","scene":"晚饭","en":"playbook","pos":"名词","zh":"战术本","example":"I got to study my playbook.","exampleZh":"我得看我的战术本。","time":"00:03:04","tip":"橄榄球里记录打法的本子。"},{"id":"believe1","level":"foundation",   function applyRemoteView(id, incoming) {

    remoteAt = Math.floor(remoteAt);
    var localAt = localView.viewUpdatedAt || 0;
    if (remoteAt < localAt) return "local";

    localView.episodeId = parsed.episodeId;
    localView.moduleId = parsed.moduleId;

  function applyMerge(remote) {
    if (!remote || typeof remote !== "object") return false;
    var dirty = false;
    rememberCurrentShow();
    var localAt = state.viewUpdatedAt || 0;
    var localStatuses = statusMap(state.statuses);
    var remoteStatuses = statusMap(remote.statuses);
    var seen = {};
    Object.keys(localStatuses).forEach(function (key) { seen[key] = true; });
    Object.keys(remoteStatuses).forEach(function (key) { seen[key] = true; });
    var merged = {};
    Object.keys(seen).forEach(function (key) {
      var local = localStatuses[key];
      var remoteRow = remoteStatuses[key];
      if (local && remoteRow) {
        if (remoteRow.updatedAt > local.updatedAt) merged[key] = remoteRow;
        else if (local.updatedAt > remoteRow.updatedAt) {
          merged[key] = local;
          dirty = true;

        dirty = true;

    if (remoteShows) {
      SHOW_IDS.forEach(function (id) {
        if (!remoteShows[id] || typeof remoteShows[id] !== "object") return;
        if (applyRemoteView(id, remoteShows[id]) === "local") dirty = true;

    } else if (applyRemoteView("ys", remote) === "local") {

    }

    remoteAt = Math.floor(remoteAt);

    if (!remoteShow && !remoteShows) remoteShow = "ys";
    if (remoteShow && remoteAt > localAt) state.showId = remoteShow;

    }
    rememberCurrentShow();
    return dirty;
  }

  function pushProgress() {
    if (!CAN_SYNC) return Promise.resolve();
    var seq = ++pushSeq;
    var url = "/api/progress?name=" + encodeURIComponent(SYNC_NAME);
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(syncPayload())
    }).then(function (res) {
      if (!res.ok) throw new Error("post");
      return res.json();
    }).then(function (remote) {
      if (seq !== pushSeq) return;
      syncReady = true;
      var before = JSON.stringify(syncPayload());
      applyMerge(remote);
      lastPushed = JSON.stringify(syncPayload());
      persistLocal();
      var hadNote = !!state.syncNote;
      state.syncNote = "";
      if (hadNote || JSON.stringify(syncPayload()) !== before) renderFromSync();
    }).catch(function () {
      if (seq !== pushSeq) return;
      if (!syncReady) return;

    });

  function pull(writeBack) {

      if (!res.ok) throw new Error("get");
      return res.json();
    }).then(function (remote) {
      if (seq !== pullSeq) return;
      var before = JSON.stringify(syncPayload());
      var dirty = applyMerge(remote);
      var after = JSON.stringify(syncPayload());
      if (after !== before) persistLocal();
      var hadNote = !!state.syncNote;
      state.syncNote = "";
      syncReady = true;
      if (!dirty) lastPushed = after;
      if (after !== before || hadNote) renderFromSync();
      if (dirty || writeBack) return pushProgress();
    }).catch(function () {
      if (seq !== pullSeq) return;
      if (!syncReady) {
        CAN_SYNC = false;
        state.syncNote = "";
        renderFromSync();
        return;

      next[i] = next[j];
      next[j] = tmp;

        var value = attrs[key];
        if (value == null || value === false) return;
        if (key === "class") node.className = value;
        else if (key === "text") node.textContent = String(value);
        else if (key === "disabled") node.disabled = !!value;

    }
    function add(child) {
      if (child == null || child === false) return;
      if (Array.isArray(child)) {
        child.forEach(add);
        return;
      }
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
    children.forEach(add);
    return node;
  }

  function startQuiz() {

    state.misses = 0;
    state.missedIds = [];
    state.revealed = false;
    state.mode = "quiz";
    touchView();
    save();
    render();
  }

  function grade(ok, id) {
    if (!id) return;
    var ep = episode();
    if (!ep) return;
    var key = markKey(ep.id, id);
    if (ok) {
      state.hits += 1;
      setStatus(key, "known");
    } else {
      state.misses += 1;
      if (state.missedIds.indexOf(id) === -1) state.missedIds.push(id);
      if (statusOf(ep.id, id) !== "known") setStatus(key, "fuzzy");
    }
    state.quizPos += 1;
    state.revealed = false;
    save();
    render();
  }

  function onClick(event) {
    var node = event.target.closest("[data-action]");
    if (!node || node.disabled) return;
    var action = node.getAttribute("data-action");
    if (action === "show") {
      var nextShow = node.getAttribute("data-show");
      if (SHOW_IDS.indexOf(nextShow) === -1 || nextShow === state.showId) return;
      rememberCurrentShow();
      state.showId = nextShow;
      copyViewOnto(state);
      if (!knownEpisode(state.episodeId, state.showId)) {
        var nextEps = episodesOf(state.showId);
        state.episodeId = nextEps.length ? nextEps[0].id : "s01e01";
        state.index = 0;
        state.mode = "preview";
        state.revealed = false;
        state.quizOrder = [];
        state.quizPos = 0;
      }
      touchView();
      save();
      render();
      return;
    }
    if (action === "place-pick") {
      if (state.placePhase !== "quiz") return;
      var pick = Number(node.getAttribute("data-index"));
      var placeItem = PLACE_ITEMS[state.placePos];
      if (!placeItem || !isFinite(pick) || pick < 0 || pick >= placeItem.options.length) return;
      state.placePicks[state.placePos] = pick;
      if (state.placePos >= PLACE_ITEMS.length - 1) {
        state.placeScores = bandScores(state.placePicks);
        state.placeRec = recommend(state.placeScores);
        state.placePhase = "result";
      } else {
        state.placePos += 1;
      }
      render();
      return;
    }
    if (action === "place-accept") {
      acceptPlace();
      return;
    }
    if (action === "place-self") {
      writePlacement({ done: true, choice: "self" });
      state.placePhase = "study";
      render();
      return;
    }
    if (action === "place-retake") {
      clearPlacement();
      state.placePhase = "quiz";
      state.placePos = 0;
      state.placePicks = [];
      state.placeRec = null;
      state.placeScores = null;
      render();
      return;
    }
    if (action === "module") {
      var moduleId = node.getAttribute("data-module");
      if (moduleId !== "3000" && moduleId !== "cet4") return;
      state.moduleId = moduleId;
      state.index = 0;
      state.revealed = false;
      state.mode = "preview";
      touchView();
      save();
      render();
      return;
    }
    if (action === "mode") {
      var mode = node.getAttribute("data-mode");
      if (mode === "quiz") startQuiz();
      else if (mode === "preview" || mode === "cover") {
        state.mode = mode;
        state.revealed = false;
        touchView();
        save();
        render();
      }
      return;
    }
    if (action === "filter") {
      var filter = node.getAttribute("data-filter");
      if (filter !== "open" && filter !== "all") return;
      state.filter = filter;
      state.index = 0;
      state.revealed = false;
      save();
      render();
      return;
    }
    if (action === "reveal" || action === "quiz-reveal") {
      state.revealed = true;
      render();
      return;
    }
    if (action === "mark") {
      var mark = node.getAttribute("data-mark");
      var id = node.getAttribute("data-id");
      var epForMark = episode();
      if (!epForMark || !id || !MARK_LABEL[mark]) return;
      setStatus(markKey(epForMark.id, id), mark);
      save();
      render();
      return;
    }
    if (action === "prev") { go(-1); return; }
    if (action === "next") { go(1); return; }
    if (action === "jump") {
      state.index = Number(node.getAttribute("data-index")) || 0;
      state.revealed = false;
      state.scrollCard = true;
      save();
      render();
      return;
    }
    if (action === "quiz-grade") {
      grade(node.getAttribute("data-ok") === "1", node.getAttribute("data-id"));
      return;
    }
    if (action === "quiz-restart") { startQuiz(); return; }
    if (action === "quiz-back") {
      state.mode = "preview";
      state.revealed = false;
      touchView();
      save();
      render();
    }
  }

  function onChange(event) {
    if (event.target.id !== "episode") return;
    var nextId = event.target.value;
    if (!knownEpisode(nextId, state.showId)) return;
    state.episodeId = nextId;
    state.index = 0;
    state.revealed = false;
    state.mode = "preview";
    touchView();
    save();
    render();
  }

  function onKey(event) {
    var tag = event.target && event.target.tagName;
    if (tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
    if (state.placePhase !== "study") return;
    if (state.mode === "quiz") return;
    if (event.key === "ArrowLeft") { event.preventDefault(); go(-1); }
    else if (event.key === "ArrowRight") { event.preventDefault(); go(1); }
  }

  function renderCard(ep, list, current, index) {
    var showMeaning = state.mode === "preview" || state.revealed;
    var status = statusOf(ep.id, current.id);
    var meta = (current.scene ? current.scene + " · " : "") + current.pos + " · " + levelText(current.level);
    var card = h("article", {
      class: "card",
      id: "card",
      "data-word-id": current.id,
      "data-status": status
    },
      h("div", { class: "card-top" },
        h("span", { text: "第 " + (index + 1) + " 条 / 共 " + list.length + " 条" }),
        h("span", { class: "time", text: current.time })
      ),
      h("h2", { class: "word", text: current.en }),
      h("p", { class: "meta", text: meta })
    );
    if (showMeaning) card.appendChild(h("p", { class: "zh", text: current.zh }));
    else card.appendChild(h("p", { class: "covered", text: "中文先盖住。先自己回忆，再打开。" }));
    var example = h("div", { class: "example" }, h("p", { text: current.example }));
    if (showMeaning && current.exampleZh) example.appendChild(h("p", { class: "ex-zh", text: current.exampleZh }));
    card.appendChild(example);
    if (showMeaning && current.tip) card.appendChild(h("p", { class: "tip", text: current.tip }));
    if (state.mode === "cover" && !state.revealed) {
      card.appendChild(h("button", {
        type: "button",
        class: "tap is-on wide",
        "data-action": "reveal"
      }, "显示释义"));
    }
    var actions = h("div", { class: "status-row" });
    [["known", "会了"], ["fuzzy", "有点印象"], ["new", "还不会"]].forEach(function (pair) {
      var on = status === pair[0];
      var cls = "tap";
      if (on && pair[0] === "fuzzy") cls += " is-fuzzy";
      else if (on) cls += " is-on";
      actions.appendChild(h("button", {
        type: "button",
        class: cls,
        "data-action": "mark",
        "data-mark": pair[0],
        "data-id": current.id,
        "aria-pressed": on ? "true" : "false"
      }, pair[1]));
    });
    card.appendChild(actions);
    card.appendChild(h("div", { class: "nav" },
      h("button", {
        type: "button",
        class: "tap",
        "data-action": "prev",
        disabled: index === 0
      }, "上一条"),
      h("button", {
        type: "button",
        class: "tap",
        "data-action": "next",
        disabled: index >= list.length - 1
      }, "下一条")
    ));
    card.appendChild(h("p", { class: "now", text: "当前：" + MARK_LABEL[status] }));
    return card;
  }

  function renderList(ep, list, index) {
    var box = h("section", {},
      h("h2", { class: "list-title", text: ep.label + "词表" })
    );
    var rows = h("div", { class: "list" });
    list.forEach(function (item, i) {
      var status = statusOf(ep.id, item.id);
      rows.appendChild(h("button", {
        type: "button",
        class: "row" + (i === index ? " is-current" : ""),
        "data-action": "jump",
        "data-index": String(i)
      },
        h("span", { class: "time", text: item.time }),
        h("span", { class: "main" },
          h("span", { class: "wen", text: item.en }),
          " ",
          h("span", { class: "mark", text: MARK_LABEL[status] })
        ),
        h("span", { class: "wzh", text: item.zh })
      ));
    });
    box.appendChild(rows);
    return box;
  }

  function renderQuiz(ep, items) {
    var quizActive = state.quizEp === ep.id && state.quizModule === state.moduleId;
    if (quizActive && items.length === 0) {
      return note("这一档没有词可测。换到「3000词水平」，或者换一集。");
    }
    if (!quizActive || state.quizOrder.length === 0) {
      return note("再点一次「看完自测」，会打乱这一集当前这一档的词。");
    }
    if (state.quizPos >= state.quizOrder.length) {
      var missed = state.missedIds.map(function (id) {
        return ep.items.filter(function (row) { return row.id === id; })[0];
      }).filter(Boolean);
      var done = h("section", { class: "card" },
        h("h2", { text: ep.label + "自测结果" }),
        h("div", { class: "stats" },
          h("div", { class: "stat" }, h("b", { text: String(state.hits) }), h("span", { text: "想起来了" })),
          h("div", { class: "stat" }, h("b", { text: String(state.misses) }), h("span", { text: "没想起来" }))
        )
      );
      if (missed.length) {
        done.appendChild(h("p", { text: "这几条再看一眼，然后就可以看这一集了。" }));
        missed.forEach(function (row) {
          done.appendChild(h("p", { class: "miss" },
            h("span", { class: "time", text: row.time }),
            " ",
            h("strong", { text: row.en }),
            " ",
            row.zh
          ));
        });
      } else {
        done.appendChild(note("这一档都能对上。可以看下一集。在上面的选单里换集，先预习再看。"));
      }
      done.appendChild(h("div", { class: "quiz-actions" },
        h("button", { type: "button", class: "tap is-on", "data-action": "quiz-restart" }, "再测一次"),
        h("button", { type: "button", class: "tap", "data-action": "quiz-back" }, "回到预习")
      ));
      return done;
    }
    var qid = state.quizOrder[state.quizPos];
    var item = ep.items.filter(function (row) { return row.id === qid; })[0];
    if (!item) return note("点「看完自测」开始。");
    var card = h("article", {
      class: "card",
      id: "card",
      "data-word-id": item.id,
      "data-status": statusOf(ep.id, item.id)
    },
      h("div", { class: "quiz-top" },
        h("span", { text: ep.label + " · 第 " + (state.quizPos + 1) + " 题 / 共 " + state.quizOrder.length + " 题" }),
        h("span", { class: "time", text: item.time })
      ),
      h("p", { class: "meta", text: "先看中文，说出英文，再核对。" }),
      h("p", { class: "zh", text: item.zh }),
      h("p", { class: "meta", text: item.pos })
    );
    if (state.revealed) {
      card.appendChild(h("h2", { class: "word", text: item.en }));
      var example = h("div", { class: "example" }, h("p", { text: item.example }));
      if (item.exampleZh) example.appendChild(h("p", { class: "ex-zh", text: item.exampleZh }));
      card.appendChild(example);
      card.appendChild(h("div", { class: "quiz-actions" },
        h("button", {
          type: "button",
          class: "tap is-on",
          "data-action": "quiz-grade",
          "data-ok": "1",
          "data-id": item.id
        }, "想起来了"),
        h("button", {
          type: "button",
          class: "tap",
          "data-action": "quiz-grade",
          "data-ok": "0",
          "data-id": item.id
        }, "没想起来")
      ));
    } else {
      card.appendChild(h("div", { class: "quiz-actions" },
        h("button", { type: "button", class: "tap is-on", "data-action": "quiz-reveal" }, "显示英文")
      ));
    }
    return card;
  }

  function renderShowPicker() {
    var box = h("div", { class: "shows", role: "group", "aria-label": "选择剧" });
    SHOWS.forEach(function (show) {
      var on = show.id === state.showId;
      box.appendChild(h("button", {
        type: "button",
        class: "show" + (on ? " is-on" : ""),
        "data-action": "show",
        "data-show": show.id,
        "aria-pressed": on ? "true" : "false"
      },
        h("span", { class: "show-line" },
          h("span", { class: "show-name", text: show.name }),
          h("span", { class: "diff diff-" + show.id, text: show.difficulty })
        ),
        show.meta ? h("span", { class: "show-meta", text: show.meta }) : null,
        h("span", { class: "show-reason", text: show.reason })
      ));
    });
    return box;
  }

  function renderPlace() {
    document.title = "先测一下水平";
    var wrap = h("div", {
      class: "wrap",
      "data-screen": state.placePhase === "result" ? "place-result" : "place"
    });
    wrap.appendChild(h("header", {},
      h("h1", { text: "先测一下水平" })
    ));
    if (state.placePhase === "result" && state.placeRec) {
      var rec = state.placeRec;
      wrap.appendChild(h("p", { class: "lede", text: "按这次的结果，建议先看这一部，用这一档。" }));
      var card = h("section", {
        class: "card",
        id: "place-result",
        "data-show": rec.showId,
        "data-module": rec.moduleId
      },
        h("p", { class: "meta", text: "建议" }),
        h("h2", { text: rec.showName }),
        h("p", { class: "zh", text: rec.moduleName }),
        h("p", { text: rec.why }),
        h("div", { class: "place-actions" },
          h("button", { type: "button", class: "tap is-on", "data-action": "place-accept" }, "就按这个开始"),
          h("button", { type: "button", class: "tap", "data-action": "place-self" }, "自己选")
        )
      );
      wrap.appendChild(card);
    } else {
      var item = PLACE_ITEMS[state.placePos] || PLACE_ITEMS[0];
      wrap.appendChild(h("p", { class: "lede", text: "一次一题，点一个选项就继续。没有倒计时。" }));
      var quiz = h("article", { class: "card", id: "place-card" },
        h("div", { class: "card-top" },
          h("span", { text: "第 " + (state.placePos + 1) + " 题 / 共 " + PLACE_ITEMS.length + " 题" })
        ),
        h("p", { class: "meta", text: "选出最接近的中文意思" }),
        h("h2", { class: "word", text: item.en })
      );
      var opts = h("div", { class: "place-options" });
      item.options.forEach(function (label, i) {
        opts.appendChild(h("button", {
          type: "button",
          class: "place-opt",
          "data-action": "place-pick",
          "data-index": String(i)
        }, label));
      });
      quiz.appendChild(opts);
      wrap.appendChild(quiz);
    }
    app.textContent = "";
    app.appendChild(wrap);
    var syncNote = document.getElementById("sync-note");
    if (syncNote) syncNote.textContent = syncLine();
  }

  function render() {
    if (state.placePhase !== "study") {
      renderPlace();
      return;
    }
    var show = currentShow();
    var ep = episode();
    var wrap = h("div", {
      class: "wrap",
      "data-show": show.id,
      "data-episode": ep ? ep.id : "",
      "data-module": state.moduleId,
      "data-mode": state.mode
    });
    wrap.appendChild(renderShowPicker());
    wrap.appendChild(h("button", {
      type: "button",
      class: "tap wide",
      "data-action": "place-retake"
    }, "重新测评"));
    document.title = show.name + "生词";
    wrap.appendChild(h("header", {},
      h("h1", { text: show.name + "生词" })
    ));
    if (show.lede) {
      wrap.appendChild(h("p", {
        class: "lede",
        text: show.lede
      }));
    }
    if (CAN_SYNC && state.syncNote) wrap.appendChild(h("p", { class: "save-error", text: state.syncNote }));
    if (state.saveError) wrap.appendChild(h("p", { class: "save-error", text: state.saveError }));

    if (!ep || !Array.isArray(ep.items) || !ep.items.length) {
      wrap.appendChild(h("p", {
        class: "missing",
        text: show.missing || "生词还没整理，因为这台电脑上没有找到字幕。"
      }));
      if (show.version) wrap.appendChild(h("p", { class: "help", text: show.version }));
      app.textContent = "";
      app.appendChild(wrap);
      var emptyNote = document.getElementById("sync-note");
      if (emptyNote) emptyNote.textContent = syncLine();
      return;
    }

    var items = moduleItems(ep);
    var list = previewList(ep);
    var index = safeIndex(list);
    var current = list[index];
    var cet4Count = ep.items.filter(function (item) { return item.level === "cet4"; }).length;
    var knownCount = 0;
    var fuzzyCount = 0;
    items.forEach(function (item) {
      var status = statusOf(ep.id, item.id);
      if (status === "known") knownCount += 1;
      if (status === "fuzzy") fuzzyCount += 1;
    });

    wrap.appendChild(h("div", { class: "choice mods", role: "group", "aria-label": "词汇档" },
      h("button", {
        type: "button",
        class: "tap" + (state.moduleId === "3000" ? " is-on" : ""),
        "data-action": "module",
        "data-module": "3000",
        "aria-pressed": state.moduleId === "3000" ? "true" : "false"
      }, "3000词水平 · " + ep.items.length),
      h("button", {
        type: "button",
        class: "tap" + (state.moduleId === "cet4" ? " is-on" : ""),
        "data-action": "module",
        "data-module": "cet4",
        "aria-pressed": state.moduleId === "cet4" ? "true" : "false"
      }, "CET-4及以上 · " + cet4Count)
    ));

    var select = h("select", { id: "episode", "aria-label": "选择集数" });
    episodesOf(state.showId).forEach(function (item) {
      var opt = h("option", { value: item.id, text: item.label + " " + item.title });
      if (item.id === ep.id) opt.selected = true;
      select.appendChild(opt);
    });
    wrap.appendChild(h("label", { class: "field" },
      h("span", { class: "field-label", text: "集数" }),
      select
    ));
    wrap.appendChild(h("section", { class: "blurb" },
      h("h2", { text: ep.title }),
      h("p", { text: ep.blurb + " 例句是字幕原句，时间是这一句开始的位置。" })
    ));
    wrap.appendChild(h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", { text: knownCount + "/" + items.length }), h("span", { text: "这一档已会" })),
      h("div", { class: "stat" }, h("b", { text: String(fuzzyCount) }), h("span", { text: "这一档还模糊" })),
      h("div", { class: "stat" }, h("b", { text: ep.label }), h("span", { text: "当前集" }))
    ));
    wrap.appendChild(h("div", { class: "choice modes", role: "group", "aria-label": "学习方式" },
      h("button", {
        type: "button",
        class: "tap" + (state.mode === "preview" ? " is-on" : ""),
        "data-action": "mode",
        "data-mode": "preview",
        "aria-pressed": state.mode === "preview" ? "true" : "false"
      }, "预习"),
      h("button", {
        type: "button",
        class: "tap" + (state.mode === "cover" ? " is-on" : ""),
        "data-action": "mode",
        "data-mode": "cover",
        "aria-pressed": state.mode === "cover" ? "true" : "false"
      }, "遮盖回忆"),
      h("button", {
        type: "button",
        class: "tap" + (state.mode === "quiz" ? " is-on" : ""),
        "data-action": "mode",
        "data-mode": "quiz",
        "aria-pressed": state.mode === "quiz" ? "true" : "false"
      }, "看完自测")
    ));

    if (state.mode === "quiz") wrap.appendChild(renderQuiz(ep, items));
    else {
      var study = h("div", {});
      study.appendChild(h("div", { class: "choice filters", role: "group", "aria-label": "筛选" },
        h("button", {
          type: "button",
          class: "tap" + (state.filter === "open" ? " is-on" : ""),
          "data-action": "filter",
          "data-filter": "open",
          "aria-pressed": state.filter === "open" ? "true" : "false"
        }, "还没会"),
        h("button", {
          type: "button",
          class: "tap" + (state.filter === "all" ? " is-on" : ""),
          "data-action": "filter",
          "data-filter": "all",
          "aria-pressed": state.filter === "all" ? "true" : "false"
        }, "全部")
      ));
      if (!current) {
        study.appendChild(note(state.filter === "open"
          ? "这组都标成会了。换到「全部」再扫一遍，或者直接去看这一集。看完点「看完自测」。"
          : "这一档没有词。换到「3000词水平」可以看到这一集更全的预习表。"));
      } else {
        study.appendChild(renderCard(ep, list, current, index));
        study.appendChild(h("p", {
          class: "help",
          text: "3000词水平把这一集留着的词都过一遍，里面包括四级。CET-4及以上只练四级和更难的。看剧时开英文字幕，对一下时间码。"
        }));
        if (state.mode === "preview") study.appendChild(renderList(ep, list, index));
      }
      wrap.appendChild(study);
    }

    app.textContent = "";
    app.appendChild(wrap);
    var syncNote = document.getElementById("sync-note");
    if (syncNote) syncNote.textContent = syncLine();
    if (state.scrollCard) {
      state.scrollCard = false;
      var card = document.getElementById("card");
      if (card && card.scrollIntoView) card.scrollIntoView({ block: "start" });
    }
  }

  if (state.needsMigrate) {
    delete state.needsMigrate;
    persistLocal();
  }
  app.addEventListener("click", onClick);
  app.addEventListener("change", onChange);
  document.addEventListener("keydown", onKey);
  render();
  if (CAN_SYNC) pull(true);
  document.addEventListener("visibilitychange", function () {
    if (!CAN_SYNC || !syncReady) return;
    if (document.visibilityState === "visible") pull(false);
  });
  setInterval(function () {
    if (!CAN_SYNC || !syncReady || document.visibilityState === "hidden") return;
    pull(false);
  }, 5000);
})();
